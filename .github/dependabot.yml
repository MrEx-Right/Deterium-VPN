# Keeps the pinned GitHub Actions (each `uses:` line is a full commit SHA with a
# version comment) fresh through one pull request a week. Nothing is merged
# automatically.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    # One pull request for all action updates instead of one per action.
    groups:
      actions:
        patterns: ["*"]

  # Rust dependencies: no routine version-bump pull requests. The big jumps
  # (eframe, boringtun, getrandom) change APIs and each needs a deliberate
  # migration, and a pull request per release only produced noise. Security
  # advisories are NOT affected by the limit below: Dependabot security updates
  # keep opening pull requests for vulnerable dependencies.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
