# Keeps the pinned GitHub Actions (each `uses:` line is a full commit SHA with a
# version comment) and the Rust dependencies up to date by opening pull
# requests. Nothing is merged automatically.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
