[package]
name = "deterium-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Native desktop GUI (egui/eframe), Windows-first."

[[bin]]
name = "deterium-gui"
path = "src/main.rs"

[dependencies]
deterium-core.workspace = true
deterium-engine.workspace = true
deterium-secrets.workspace = true
deterium-proto-wireguard.workspace = true
eframe = "0.28"
rfd = "0.14"

[target.'cfg(windows)'.dependencies]
deterium-service.workspace = true
tray-icon = { version = "0.19", default-features = false }
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
png = "0.18"
ab_glyph = "0.2"
egui = "0.28"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
