[package]
name = "deterium-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "How the app talks to the background service: the request/response protocol and the Windows named-pipe transport."

[dependencies]
deterium-core.workspace = true
serde.workspace = true
serde_json = "1"
thiserror.workspace = true

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Services",
]
